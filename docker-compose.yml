version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://forexlive:forexlive@db:5432/forexlive
      - TWELVE_DATA_API_KEY=${TWELVE_DATA_API_KEY}
      - ENVIRONMENT=development
      - FRONTEND_URL=http://localhost:3000
      - MAX_CONNECTIONS=100
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - backend

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=forexlive
      - POSTGRES_PASSWORD=forexlive
      - POSTGRES_DB=forexlive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forexlive"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
